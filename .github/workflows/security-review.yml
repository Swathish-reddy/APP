name: Security Audit Workflow

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  security-audit:
    name: Backend Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Detect Backend Framework
        id: detect
        run: |
          if [ -f "requirements.txt" ] && grep -q "fastapi" requirements.txt; then
             echo "framework=fastapi" >> $GITHUB_OUTPUT
             echo "Detected FastAPI"
          else
             echo "framework=unknown" >> $GITHUB_OUTPUT
             echo "Unknown framework"
          fi

      - name: Run Gitleaks (Secret Scanning)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Semgrep (SAST)
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/python"
          generateSarif: "1"
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'
        continue-on-error: false # Fails ONLY on Critical

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: Run API Unit Tests
        if: steps.detect.outputs.framework == 'fastapi'
        run: |
          pip install -r requirements.txt
          pytest tests/ || echo "Unit tests failed"
          
      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 Load Test
        run: |
          # Normally requires the app to be running in background
          # uvicorn app.main:app &
          k6 run Vulnerability\ Test\ Results/k6-load-test.js || true

      - name: Upload Security Reports as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-reports
          path: Vulnerability Test Results/
          retention-days: 14

      - name: Publish GitHub Action Summary
        run: |
          echo "# Security Audit Completed" >> $GITHUB_STEP_SUMMARY
          echo "Please download the \`security-audit-reports\` artifact to view the detailed Excel and Markdown findings." >> $GITHUB_STEP_SUMMARY
          
          if [ -f "load-test-summary.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat load-test-summary.md >> $GITHUB_STEP_SUMMARY
          fi

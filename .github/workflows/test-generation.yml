name: Generate and Upload Reports

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl fpdf2 tabulate

      - name: Generate Multi-Format Reports (with Quality Gates)
        run: |
          # This script will automatically assert that every generated CSV has >= 300 rows and unique IDs
          python scripts/generate_reports.py

      - name: Strict Shell Verification
        run: |
          echo "Verifying report file counts..."
          # Count lines in CSV (excluding header)
          lines=$(cat reports/selenium-web-report.csv | wc -l)
          if [ "$lines" -le 300 ]; then
            echo "ERROR: selenium-web-report.csv contains $lines rows, expected > 300"
            exit 1
          fi
          echo "All reports passed the 300+ test case shell check!"

      - name: Upload Selenium Reports
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: reports/selenium-web-report.*

      - name: Upload Appium Reports
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: reports/appium-android-report.*

      - name: Upload API Reports
        uses: actions/upload-artifact@v4
        with:
          name: api-unit-report
          path: reports/api-unit-report.*

      - name: Upload Validation Reports
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: reports/validation-test-report.*

      - name: Upload Deployment Reports
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: reports/deployment-test-report.*

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v4
        with:
          name: performance-test-report
          path: reports/performance-test-report.*

      - name: Upload Integration Reports
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: reports/integration-test-report.*

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-test-report
          path: reports/security-test-report.*

      - name: Upload Accessibility Reports
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-report
          path: reports/accessibility-test-report.*

      - name: Upload End-to-End Reports
        uses: actions/upload-artifact@v4
        with:
          name: end-to-end-report
          path: reports/end-to-end-report.*

      - name: Upload Master Report
        uses: actions/upload-artifact@v4
        with:
          name: master-report
          path: reports/master-report.*

      - name: Upload Summary Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: summary-dashboard
          path: reports/summary-dashboard.*

name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  setup-node:
    name: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Generate logs
        run: echo "Generating logs for setup-node"
      - name: Create Artifact
        run: |
          mkdir -p build
          echo "web build" > build/web-build.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/

  selenium-tests:
    name: selenium-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Generate logs
        run: echo "Generating logs for selenium-tests"
      - name: Create Artifact
        run: |
          mkdir -p report
          echo "selenium report" > report/selenium-report.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: report/

  appium-tests:
    name: appium-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Generate logs
        run: echo "Generating logs for appium-tests"
      - name: Create Artifact
        run: |
          mkdir -p report
          echo "appium report" > report/appium-report.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: report/

  load-tests:
    name: load-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Generate logs
        run: echo "Generating logs for load-tests"
      - name: Create Artifact
        run: |
          mkdir -p report
          echo "load report" > report/load-report.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: report/

  security-assessment:
    name: security-assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Generate logs
        run: echo "Generating logs for security-assessment"
      - name: Create Artifact
        run: |
          mkdir -p report
          echo "security report" > report/security-report.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: report/

  summary:
    name: summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Generate logs
        run: echo "Generating logs for summary"
      - name: Create Artifact
        run: |
          mkdir -p report
          echo "summary" > report/summary.txt
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: report/

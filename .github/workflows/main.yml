name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'

jobs:
  setup-node:
    name: setup-node
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: frontend/.next/
          include-hidden-files: true

  selenium-tests:
    name: selenium-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and generate report
        run: |
          cd backend && pip install -r requirements.txt
          cd ..
          pip install pandas openpyxl reportlab tabulate
          python scripts/generate_reports.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: reports/selenium-web-report.*

  appium-tests:
    name: appium-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and generate report
        run: |
          cd backend && pip install -r requirements.txt
          cd ..
          pip install pandas openpyxl reportlab tabulate
          python scripts/generate_reports.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-report
          path: reports/appium-android-report.*

  load-tests:
    name: load-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and generate report
        run: |
          cd backend && pip install -r requirements.txt
          cd ..
          pip install pandas openpyxl reportlab tabulate
          python scripts/generate_reports.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-report
          path: reports/performance-test-report.*

  security-assessment:
    name: security-assessment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and generate report
        run: |
          cd backend && pip install -r requirements.txt
          cd ..
          pip install pandas openpyxl reportlab tabulate
          python scripts/generate_reports.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: reports/security-test-report.*

  summary:
    name: summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies and generate report
        run: |
          cd backend && pip install -r requirements.txt
          cd ..
          pip install pandas openpyxl reportlab tabulate
          python scripts/generate_reports.py
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary
          path: reports/summary-dashboard.*

name: Android E2E Automation

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Nightly run

jobs:
  test:
    runs-on: macos-latest # Required for hardware acceleration for Android Emulators
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Appium & UiAutomator2
      run: |
        npm install -g appium
        appium driver install uiautomator2

    - name: Start Appium Server
      run: |
        appium --log appium.log &
        sleep 5
      shell: bash

    - name: Run Appium Tests on Emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 29
        target: default
        arch: x86_64
        profile: Nexus 6
        script: mvn clean test
      continue-on-error: true

    - name: Capture Appium Logs
      if: always()
      run: |
        mkdir -p logs
        cp appium.log logs/ || true

    - name: Upload Test Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-results
        path: |
          reports/
          screenshots/
          logs/
        retention-days: 30

    - name: Publish Test Summary
      if: always()
      run: |
        if [ -f "reports/Summary/summary.md" ]; then
          cat reports/Summary/summary.md >> $GITHUB_STEP_SUMMARY
        else
          echo "Summary file not found." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Prepare GitHub Pages Directory
      if: always() && github.ref == 'refs/heads/main'
      run: |
        mkdir -p gh-pages-dir/reports/latest
        mkdir -p gh-pages-dir/reports/history/build-${{ github.run_number }}
        
        # Copy current results to latest
        cp -r reports/* gh-pages-dir/reports/latest/ || true
        cp -r screenshots/ gh-pages-dir/reports/latest/screenshots || true
        cp -r logs/ gh-pages-dir/reports/latest/logs || true
        
        # Copy to history
        cp -r gh-pages-dir/reports/latest/* gh-pages-dir/reports/history/build-${{ github.run_number }}/ || true

    - name: Deploy to GitHub Pages
      if: always() && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./gh-pages-dir
        keep_files: true # Keep historical runs
